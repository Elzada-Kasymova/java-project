spring.application.name=notification-service

server.port=8086

spring.datasource.url=jdbc:postgresql://postgres-notification:5436/notificationdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
notification.rabbitmq.queue=notification-queue
notification.rabbitmq.exchange=notification-exchange
notification.rabbitmq.routing-key=notification-key
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=notification-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.security.oauth2.client.registration.keycloak.client-id=notification-client
spring.security.oauth2.client.registration.keycloak.client-secret=8FijiP9Kz6VYdqqUo63fgx7fGQpAlTKr
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8000/login/oauth2/code/keycloak

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/crm-realm
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/crm-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/crm-realm/protocol/openid-connect/certs

logging.level.org.springframework.security=DEBUG