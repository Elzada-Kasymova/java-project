spring.application.name=deal-service


server.port=8087

spring.datasource.url=jdbc:postgresql://postgres-deal:5437/dealdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=deal-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.security.oauth2.client.registration.keycloak.client-id=deal-notification
spring.security.oauth2.client.registration.keycloak.client-secret=B8YjrODVi4mVx9tqxkFTU49vlecTG3Qe
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/crm-realm
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/crm-realm/protocol/openid-connect/certs

spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8004/login/oauth2/code/keycloak


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/crm-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/crm-realm/protocol/openid-connect/certs