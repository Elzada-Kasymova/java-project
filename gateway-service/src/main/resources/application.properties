spring.application.name=gateway-service
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.main.web-application-type=reactive

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway routes
spring.cloud.gateway.routes[0].id=users-service
spring.cloud.gateway.routes[0].uri=lb://users-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[5].id=users-service-internal
spring.cloud.gateway.routes[5].uri=lb://users-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/internal/users/**
spring.cloud.gateway.routes[5].filters[0]=TokenRelay


spring.cloud.gateway.routes[1].id=company-service
spring.cloud.gateway.routes[1].uri=lb://company-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/company/**


spring.cloud.gateway.routes[2].id=activity-service
spring.cloud.gateway.routes[2].uri=lb://activity-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/activity/**
spring.cloud.gateway.routes[6].id=activity-service-internal
spring.cloud.gateway.routes[6].uri=lb://activity-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/internal/activity/**
spring.cloud.gateway.routes[6].filters[0]=TokenRelay

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notification/**


spring.cloud.gateway.routes[4].id=deal-service
spring.cloud.gateway.routes[4].uri=lb://deal-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/deals/**
spring.cloud.gateway.routes[7].id=deal-service-internal
spring.cloud.gateway.routes[7].uri=lb://deal-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/internal/deal/**
spring.cloud.gateway.routes[7].filters[0]=TokenRelay

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
spring.main.allow-bean-definition-overriding=true
